version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The package ships zero runtime dependencies on purpose, so everything here is tooling and can
    # be grouped into one pull request instead of a weekly drip.
    groups:
      dev-tooling:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # init, analyze and upload-sarif must run the same version: init writes a config that analyze
    # refuses to load from any other release. Bumped one at a time, each pull request fails CI.
    groups:
      codeql-action:
        patterns: ['github/codeql-action*']

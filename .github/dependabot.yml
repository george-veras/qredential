version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The package ships zero runtime dependencies on purpose, so everything here is tooling and can
    # be grouped into one pull request instead of a weekly drip.
    groups:
      dev-tooling:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for every action, for two reasons learned the hard way. CodeQL's init,
    # analyze and upload-sarif must run the same version, and bumped one at a time each pull request
    # failed CI. And checkout and setup-node sit on adjacent lines in four workflows, so separate
    # pull requests conflicted with each other as soon as one of them merged.
    groups:
      actions:
        patterns: ['*']

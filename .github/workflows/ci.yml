name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          # The library targets browsers and React Native as much as Node, so the crypto and
          # compression paths are worth exercising on a second platform.
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browsers:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }} --with-deps
      # The same test files as the Node job. The library has no Node specific code, so there is
      # nothing to fork, and until this existed "runs in browsers" was a claim with three versions
      # of Node behind it.
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}

  playground:
    name: playground matches src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The pages carry an inlined copy of the library. This fails when someone edits src and
      # forgets to rebuild, which would otherwise ship a playground that disagrees with the package
      # people install.
      - run: npm run check:site

      # A translation records the hash of the English it was made from. When the English changes and
      # a translation does not, this says so, rather than letting the page quietly drift into being
      # wrong in a language nobody here can read.
      - name: translations are not behind the English
        run: npm run check:translations
        continue-on-error: true

      # The playground prints an expected rejection code on every attack button. This clicks all of
      # them and checks the verifier actually answers with it. A README that lies is embarrassing;
      # a live demo that lies is worse, because the visitor came specifically to check.
      - run: npx playwright install chromium --with-deps
      - run: npm run check:playground

      # Whether the site can still be found, in nine languages: canonicals, a reciprocal hreflang
      # group, one share card and one title per language, the sitemap, the IndexNow key, and the
      # language offer actually behaving in a browser set to somebody else's language. This kind of
      # thing breaks silently, which is why it is tested rather than eyeballed.
      - run: npm run check:seo

      # WCAG 2.2 AA across all twenty seven pages in both themes, plus the one thing no scanner
      # checks: that a keyboard reaches the skip link first and that using it moves focus. Automation
      # sees about a third of the standard, so this is a floor, not a pass mark.
      - run: npm run check:a11y

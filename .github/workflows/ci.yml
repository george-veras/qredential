name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          # The library targets browsers and React Native as much as Node, so the crypto and
          # compression paths are worth exercising on a second platform.
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browsers:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }} --with-deps
      # The same test files as the Node job. The library has no Node specific code, so there is
      # nothing to fork, and until this existed "runs in browsers" was a claim with three versions
      # of Node behind it.
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}

  playground:
    name: playground matches src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # docs/index.html carries an inlined copy of the library. This fails when someone edits src
      # and forgets to rebuild it, which would otherwise ship a playground that disagrees with the
      # package people install.
      - run: npm run check:site

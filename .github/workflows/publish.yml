name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the job signs an attestation tying the published tarball to
      # this exact commit, workflow and runner. Anyone can then verify the package on npm was built
      # from the public source, which is a claim this library should be able to make about itself.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 24 rather than 22 because trusted publishing needs npm 11.5.1 or newer, and Node 22
          # ships npm 10. Installing a newer npm on top would be an unpinned download inside the
          # one job that is allowed to publish.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing: npm trusts this workflow's OIDC identity, configured on npmjs.com for
      # this repository and publish.yml, so no token exists anywhere.
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public

  release-assets:
    # A separate job on purpose. The one above holds the OIDC token npm trusts to publish; this one
    # holds write access to the repository to attach files to the release. Neither needs the other.
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # The tag goes through the environment, never straight into the script, so nothing in a tag
      # name can become shell.
      - run: node scripts/release-assets.mjs "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}

name: scorecard

# OpenSSF Scorecard grades the repository's security posture: branch protection, pinned actions,
# dangerous workflow patterns, whether releases are signed. For a library people are asked to put
# between a person and a right they hold, the grade is part of the pitch.

on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2.4.0 and earlier pull the action image from gcr.io, which currently answers with a
      # billing error on OpenSSF's side. v2.4.4 moved to ghcr.io.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif

<title>Qredential Documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #E8ECE8;
    --panel: #F4F6F3;
    --ink: #111A1D;
    --body: #24312F;
    --slate: #5C6C6B;
    --line: #C7D0CA;
    --line-soft: #DBE2DC;
    --viridian: #0E6B54;
    --viridian-wash: #D9E7E0;
    --oxblood: #8F2E26;
    --guilloche: #2C6675;
    --amber: #8A5A12;
    --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --text: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0C1214; --panel: #141D20; --ink: #E4EAE5; --body: #C4CFCA;
      --slate: #8A9A97; --line: #263336; --line-soft: #1C272A;
      --viridian: #4FBB98; --viridian-wash: #10322A; --oxblood: #DF8074;
      --guilloche: #63AABC; --amber: #D6A45A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0C1214; --panel: #141D20; --ink: #E4EAE5; --body: #C4CFCA;
    --slate: #8A9A97; --line: #263336; --line-soft: #1C272A;
    --viridian: #4FBB98; --viridian-wash: #10322A; --oxblood: #DF8074;
    --guilloche: #63AABC; --amber: #D6A45A;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--body);
    font-family: var(--text); font-size: 15.5px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--guilloche); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--guilloche); outline-offset: 2px; }

  .masthead {
    border-bottom: 2px solid var(--ink);
    position: sticky; top: 0; z-index: 20;
    background: var(--ground);
  }
  .masthead-inner {
    max-width: 1140px; margin: 0 auto; padding: 14px 22px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
  }
  .mark {
    font-family: var(--display); font-weight: 700; font-size: 22px;
    letter-spacing: -0.02em; color: var(--ink); text-decoration: none;
  }
  .mark span { color: var(--viridian); }
  .masthead nav { display: flex; gap: 18px; margin-left: auto; font-size: 14px; }
  .masthead nav a { color: var(--slate); text-decoration: none; }
  .masthead nav a:hover, .masthead nav a[aria-current="page"] { color: var(--ink); }

  .shell {
    max-width: 1140px; margin: 0 auto; padding: 36px 22px 90px;
    display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 46px; align-items: start;
  }
  @media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); gap: 26px; } }

  .toc { position: sticky; top: 74px; font-size: 13.5px; }
  @media (max-width: 900px) {
    .toc { position: static; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  }
  .toc h2 {
    font-family: var(--display); font-weight: 600; font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--slate);
    margin: 0 0 10px;
  }
  .toc ol { list-style: none; margin: 0 0 20px; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .toc a { color: var(--slate); text-decoration: none; display: block; }
  .toc a:hover { color: var(--ink); }

  article { min-width: 0; max-width: 72ch; }
  article > section { margin-bottom: 52px; scroll-margin-top: 78px; }

  h1 {
    font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1.08;
    letter-spacing: -0.028em; color: var(--ink); margin: 0 0 14px; text-wrap: balance;
  }
  .lede { font-size: 18px; line-height: 1.55; color: var(--body); margin: 0 0 8px; text-wrap: balance; }
  h2 {
    font-family: var(--display); font-weight: 600; font-size: 22px;
    letter-spacing: -0.012em; color: var(--ink); margin: 0 0 12px; text-wrap: balance;
  }
  h3 {
    font-family: var(--display); font-weight: 600; font-size: 15px;
    letter-spacing: 0.01em; color: var(--ink); margin: 26px 0 8px;
  }
  .eyebrow {
    font-family: var(--data); font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--slate); margin: 0 0 8px;
  }
  p { margin: 0 0 14px; }
  ul { margin: 0 0 14px; padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--ink); font-weight: 600; }
  em { color: var(--ink); }

  code {
    font-family: var(--data); font-size: 0.88em; color: var(--guilloche);
    word-break: break-word;
  }
  pre {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--viridian);
    padding: 14px 16px; overflow-x: auto; margin: 0 0 16px;
  }
  pre code { color: var(--ink); font-size: 13px; line-height: 1.7; word-break: normal; }
  .tok-c { color: var(--slate); font-style: italic; }
  .tok-s { color: var(--viridian); }
  .tok-k { color: var(--oxblood); }

  .tablewrap { overflow-x: auto; margin: 0 0 18px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th {
    font-family: var(--display); font-weight: 600; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--slate); text-align: left;
    padding: 0 14px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  td:first-child { white-space: nowrap; }
  td code { white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }

  .signature {
    font-family: var(--data); font-size: 13.5px; color: var(--ink);
    background: var(--viridian-wash); border-left: 3px solid var(--viridian);
    padding: 11px 14px; margin: 0 0 14px; overflow-x: auto; white-space: pre;
  }
  .aside {
    border-left: 3px solid var(--amber); padding: 2px 0 2px 15px;
    margin: 0 0 18px; color: var(--slate); font-size: 14.5px;
  }
  .aside strong { color: var(--ink); }

  .cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 6px; }
  .cta {
    font-family: var(--text); font-weight: 500; font-size: 14.5px;
    padding: 10px 20px; text-decoration: none; border: 1px solid var(--ink);
    background: var(--ink); color: var(--ground);
  }
  .cta:hover { background: var(--viridian); border-color: var(--viridian); color: #FDFDFB; }
  .cta.ghost { background: transparent; color: var(--ink); }
  .cta.ghost:hover { background: transparent; border-color: var(--viridian); color: var(--viridian); }

  .reason { font-family: var(--data); font-size: 12.5px; color: var(--oxblood); white-space: nowrap; }

  footer {
    border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px;
    font-size: 13px; color: var(--slate); display: flex; flex-wrap: wrap; gap: 6px 24px;
  }

  .toc ol.langs a[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .toc ol.langs .behind { color: var(--amber); font-size: 11px; display: block; }

  .provenance {
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    background: var(--panel);
    padding: 14px 16px;
    margin: 0 0 40px;
    font-size: 13.5px;
    color: var(--slate);
    line-height: 1.55;
  }
  .provenance strong { color: var(--ink); }
  .provenance a { color: var(--guilloche); }
  .provenance .fix {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--text);
    font-weight: 500;
    font-size: 13.5px;
    padding: 7px 14px;
    text-decoration: none;
    border: 1px solid var(--ink);
    color: var(--ink);
  }
  .provenance .fix:hover { border-color: var(--viridian); color: var(--viridian); }
</style>
